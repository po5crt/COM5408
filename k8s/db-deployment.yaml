apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-ddeployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: database

  template:
    metadata:
      labels:
        app: database

    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES-DB 
              value: "todo"

          volumeMounts:
              - mountPath: /var/lib/postgresql/data
                name: db-storage 
              - mountPath: /Docker-entrypoint-initdb.d/im=nit.sql
                name: db-init-script-valume
                subPath: init.sql
      volumes:
          - name: db-storage
            persistentVolumeClaim:
              claimName: db-pvc
          - name: db-init-script-valume
            configMap:
              name: db-init-script-configmap

