services:
  database:
   image: postgres:18-alphine
   restart: always
   environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: Bolton26
    POSTGRES_DB: todo
   volumes:
     - ./db/init.sql:/docker-endtrypoint-initdb,d/init.sql
     - pgdata:/var/lib/postgresql/database
   ports:
    - '5432:5432'
  
  backend:
    build: ./backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      DB_HOST: database
      DB_USER: postgres
      DB_PASSWORD: Bolton26
      DB_NAME: todo
      DB_PORT: 5432
      PORT: 5000
    depends_on:
      - database
    frontend:
      build: ./web
      restart: always
      ports: 
        - '3000:3000'
      depends_on:
        - backend

volumes:
  pgdata:      
     




